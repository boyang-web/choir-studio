<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>合唱练习室 · 界面方案对比</title><style>*{box-sizing:border-box}body{margin:0;background:#e9eaec;color:#25282b;font:14px Arial,"Microsoft YaHei",sans-serif}header{padding:18px 24px;background:white;border-bottom:1px solid #ccc}h1{font-size:20px;margin:0 0 9px;font-weight:500}p{font-size:12px;line-height:1.8;color:#62686e;margin:0}.choices{display:flex;gap:8px;flex-wrap:wrap;margin-top:13px}button,a{font:inherit;border:1px solid #bfc4ca;background:white;border-radius:2px;padding:9px 13px;cursor:pointer;color:#333;text-decoration:none}button.active{background:#303942;color:white;border-color:#303942}.devices{display:flex;gap:7px;align-items:center;padding:12px 24px;flex-wrap:wrap;font-size:12px}.devices button{font-size:12px;padding:7px 10px}main{padding:0 18px 20px;overflow:auto;display:flex;justify-content:center}iframe{width:100%;height:calc(100dvh - 200px);min-height:520px;max-width:100%;border:1px solid #aeb4ba;background:white}a{font-size:12px;margin-left:auto}#caption{font-size:12px;color:#676e75;padding:0 24px 12px}@media(max-width:600px){header{padding:14px}h1{font-size:18px}.devices{padding:10px 14px}main{padding:0 5px 10px}iframe{height:calc(100dvh - 250px)}.devices a{margin:0}}</style><header><h1>合唱练习室 · 界面方案对比</h1><p>三份独立 HTML，可切换手机、平板、电脑宽度。使用原 PDF 谱面；分声部、音色选择和按钮仅作视觉交互示意。</p><div class="choices"><button class="active" data-theme="a">A 排练工作台</button><button data-theme="b">B 纸质谱夹</button><button data-theme="c">C 声部调音台</button></div></header><div class="devices"><span>预览尺寸</span><button data-width="390">手机 390</button><button data-width="768">平板竖屏 768</button><button data-width="1024">平板横屏 1024</button><button data-width="100%">电脑 / 铺满</button><a id="open" href="a.html" target="_blank">单独打开当前方案 ↗</a></div><div id="caption">A：紧凑、明确的操作区。曲库、乐谱和声部列表各有固定位置。</div><main><iframe id="preview" src="a.html" title="界面方案预览"></iframe></main><script>const captions={a:'A：紧凑、明确的操作区。曲库、乐谱和声部列表各有固定位置。',b:'B：优先阅读。暖白纸面、克制的控制栏，适合手机和平板长时间看谱。',c:'C：优先排练控制。深色工具区、下方分声部通道，突出音色、音量与独听。'};document.querySelectorAll('[data-theme]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-theme]').forEach(x=>x.classList.toggle('active',x===b));document.getElementById('preview').src=b.dataset.theme+'.html';document.getElementById('open').href=b.dataset.theme+'.html';document.getElementById('caption').textContent=captions[b.dataset.theme]});document.querySelectorAll('[data-width]').forEach(b=>b.onclick=()=>{document.getElementById('preview').style.width=b.dataset.width.endsWith('%')?b.dataset.width:b.dataset.width+'px';document.querySelectorAll('[data-width]').forEach(x=>x.classList.toggle('active',x===b))});</script></html>
