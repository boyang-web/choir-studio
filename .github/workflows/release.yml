name: Build and release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: choir-studio/package-lock.json
      - run: npm --prefix choir-studio ci --no-audit --no-fund
      - run: npm --prefix choir-studio test
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install PyMuPDF==1.26.7
      - run: python tools/audit_hui_sheng.py

  windows:
    needs: verify
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install Pillow==12.1.1
      - shell: pwsh
        run: ./choir-studio/scripts/build-windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: choir-studio/releases/ChoirStudio.exe
          if-no-files-found: error

  android:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v4
      - run: npm --prefix choir-studio ci --no-audit --no-fund
      - working-directory: choir-studio
        run: npx cap sync android
      - run: chmod +x choir-studio/android/gradlew
      - working-directory: choir-studio/android
        run: ./gradlew assembleDebug --no-daemon --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: choir-studio/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  macos:
    needs: verify
    runs-on: macos-latest
    strategy:
      matrix:
        arch: [arm64, x64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: choir-studio/macos/package-lock.json
      - working-directory: choir-studio/macos
        run: npm ci --no-audit --no-fund
      - working-directory: choir-studio/macos
        run: bash ../scripts/build-macos.sh ${{ matrix.arch }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: choir-studio/releases/macos/*.dmg
          if-no-files-found: error

  publish:
    if: contains(github.event.head_commit.message, '[release]') || github.event_name == 'workflow_dispatch'
    needs: [windows, android, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-artifacts
      - name: Prepare named installers and checksums
        shell: bash
        run: |
          mkdir release-files
          cp release-artifacts/windows/ChoirStudio.exe release-files/ChoirStudio-1.9.0-Windows-x64.exe
          cp release-artifacts/android/app-debug.apk release-files/ChoirStudio-1.9.0-Android.apk
          cp release-artifacts/macos-*/*.dmg release-files/
          cd release-files
          sha256sum * > SHA256SUMS.txt
      - name: Publish only after all builds pass
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create v1.9.0 release-files/* --target "$GITHUB_SHA" --title '和声练习室 1.9.0 · 回声' --notes-file docs/release-1.9.0.md
